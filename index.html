<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PANGANTARA</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Caveat:wght@600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#2F5D3A;--sage:#E4ECD6;--krem:#FBF6E8;--or:#E8792B;--ku:#F2B233;--t:#2B2B2B;--t2:#6B6B6B;--b:#E3DFD0;--ok:#3B8B4F;--err:#C0392B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#e9e4d4;font-family:Nunito,system-ui,sans-serif;color:var(--t);display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--krem);position:relative;padding-bottom:76px;overflow-x:hidden}
@media(min-width:500px){#app{margin:20px 0;min-height:860px;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.12)}}
h1,h2,h3{font-family:'Baloo 2',Nunito,sans-serif;line-height:1.15}
.logo{display:inline-flex;align-items:center;gap:6px;font:800 28px 'Baloo 2'}
.logo .sun{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,var(--ku) 55%,transparent 60%);border:3px dotted var(--ku)}
.g{color:var(--g)}.o{color:var(--or)}
.hand{font-family:Caveat,cursive;font-size:20px;color:var(--or)}
.mu{color:var(--t2);font-size:13px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh;padding:24px;gap:14px}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:14px;margin:0 14px 12px}
.btn{width:100%;padding:13px;border-radius:999px;border:0;background:var(--g);color:#fff;font:800 15px Nunito;min-height:46px}
.btn.o{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn:disabled{opacity:.45}
.chip{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--sage);color:var(--g);font:700 13px Nunito;border:1.5px solid transparent;margin:3px;white-space:nowrap}
.chip.on{background:var(--g);color:#fff}
.bar{position:sticky;top:0;z-index:5;background:var(--krem);padding:12px 14px;display:flex;align-items:center;gap:10px}
.ib{background:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative;flex-shrink:0}
.dot{position:absolute;top:-3px;right:-3px;background:var(--or);color:#fff;font:800 10px Nunito;border-radius:999px;padding:0 5px}
.sb{display:flex;background:#fff;border-radius:999px;border:1.5px solid var(--b);padding:4px 4px 4px 16px;align-items:center;flex:1}
.sb input{border:0;padding:8px 0;font-size:14px;background:none;flex:1;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.pc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;min-width:0}
.pimg{height:112px;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}
.loc{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.92);font:700 11px Nunito;padding:2px 8px;border-radius:999px;color:var(--g)}
.pb{padding:10px}
.pr{color:var(--g);font:800 16px 'Baloo 2'}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:14px 14px 8px}
.sec h3{color:var(--g);font-size:19px}
.sec a{color:var(--g);font-size:13px;font-weight:700;cursor:pointer}
.bn{margin:12px 14px 6px;border-radius:20px;background:linear-gradient(120deg,var(--g),#4f7f57);color:#fff;padding:20px;min-height:150px;position:relative;overflow:hidden}
.bn h2{font-size:24px;margin:4px 0}
.bn .big{position:absolute;right:14px;bottom:10px;font-size:64px}
.dots{text-align:center;margin-bottom:8px}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--b);margin:0 3px;cursor:pointer}
.dots i.on{background:var(--g);width:18px;border-radius:999px}
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
.cat{flex:0 0 auto;text-align:center;font:700 12px Nunito;width:66px;background:none;border:0;color:var(--t)}
.cat span{display:flex;width:56px;height:56px;margin:0 auto 4px;border-radius:50%;background:var(--sage);align-items:center;justify-content:center;font-size:26px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;border-top:1px solid var(--b);z-index:9}
.nav button{flex:1;background:none;border:0;padding:7px 0 9px;font:700 11px Nunito;color:var(--t2);position:relative}
.nav button.on{color:var(--g)}
.nav i{display:block;font-style:normal;font-size:19px}
.tara{position:fixed;right:max(16px,calc(50% - 199px));bottom:86px;width:54px;height:54px;border-radius:50%;background:#fff;border:2px solid var(--g);font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:8}
.bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--b);padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:9}
.bbar .btn{width:auto;flex:1;min-width:0;white-space:nowrap;padding:10px 8px;font-size:13px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:30;white-space:nowrap}
input,select{font:600 15px Nunito;padding:12px 14px;border:1.5px solid var(--b);border-radius:14px;width:100%;background:#fff;outline:none;color:var(--t)}
input:focus{border-color:var(--g)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--g)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font:800 11px Nunito;padding:3px 10px;border-radius:999px;background:var(--sage);color:var(--g);white-space:nowrap}
.step{display:flex;justify-content:space-between;margin-top:10px;font-size:10px;color:var(--t2);text-align:center}
.step i{display:block;width:12px;height:12px;border-radius:50%;background:var(--b);margin:0 auto 3px}
.step i.on{background:var(--g)}
.stp{display:flex;align-items:center;gap:10px}
.stp button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--g);background:#fff;color:var(--g);font-size:17px;font-weight:800}
.plus{background:linear-gradient(90deg,var(--ku),var(--or));color:#fff;font:800 10px Nunito;padding:2px 8px;border-radius:999px}
.lock{position:relative;overflow:hidden;border-radius:12px}
.lock .blur{filter:blur(4px);user-select:none;padding:10px;color:var(--t2);font-size:14px;line-height:1.6}
.lock .ov{position:absolute;inset:0;background:rgba(251,246,232,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.otp input{width:46px;height:56px;text-align:center;font:800 22px 'Baloo 2';padding:0}
.bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5;margin-bottom:8px}
.me{background:var(--g);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.ai{background:#fff;border:1px solid var(--b);border-bottom-left-radius:4px}
.tabs{display:flex;background:#fff;border-radius:999px;padding:4px;margin:0 14px 10px;border:1px solid var(--b)}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:999px;font:700 13px Nunito;color:var(--t2)}
.tabs button.on{background:var(--g);color:#fff}
.hd{background:linear-gradient(135deg,var(--g),#4f7f57);color:#fff;padding:22px 16px 34px;border-radius:0 0 26px 26px}
.empty{text-align:center;padding:40px 20px;color:var(--t2)}
.ill{font-size:64px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--b);text-align:center}
.tbl td:first-child,.tbl th:first-child{text-align:left}
label{cursor:pointer}
.ic{width:40px;height:40px;display:inline-block;vertical-align:middle}
img.ic{object-fit:cover;border-radius:12px}
.pimg .ic{width:88px;height:88px;display:block}
.hero .ic{width:170px;height:170px;display:block}
.between .ic{width:24px;height:24px}
.gal-wrap{position:relative}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:260px;scrollbar-width:none;background:var(--sage)}
.gal::-webkit-scrollbar{display:none}
.gslide{flex:0 0 100%;scroll-snap-align:start;height:260px;overflow:hidden}
.gslide img{width:100%;height:100%;object-fit:cover;display:block}
.gsvg{height:260px;display:flex;align-items:center;justify-content:center}
.gsvg svg{width:170px;height:170px}
.gcount{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}
div[style*="width:60px"] .ic{width:60px;height:60px}
.pimg .ph,.hero .ph{width:100%;height:100%;border-radius:0}
.bn h2,.bn p,.bn button{position:relative;z-index:1}
.sheetov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--krem);width:100%;max-width:430px;border-radius:20px 20px 0 0;height:72vh;display:flex;flex-direction:column}
.sbody{flex:1;display:flex;min-height:0}
.side{width:118px;overflow-y:auto;background:#fff;border-right:1px solid var(--b)}
.side button{display:block;width:100%;text-align:left;padding:12px 10px;border:0;background:none;font:700 13px Nunito;color:var(--t2)}
.side button.on{color:var(--g);background:var(--krem);box-shadow:inset 3px 0 var(--g)}
.pane{flex:1;padding:12px;overflow-y:auto}
.pane input{width:48%;margin-right:2%}

:root{--app-w:430px}
body.dv-tab{--app-w:768px}
body.dv-lap{--app-w:1040px}
#app{max-width:var(--app-w)}
.nav,.bbar,.sheet{max-width:var(--app-w)}
body.dv-tab .grid{grid-template-columns:repeat(3,1fr)}
body.dv-tab .gal,body.dv-tab .gal .gslide,body.dv-tab .gsvg{height:340px}
body.dv-lap #app{margin:0 auto;border-radius:0;box-shadow:none;min-height:100vh;padding-bottom:24px}
body.dv-lap #app:has(.nav){padding-left:220px;box-sizing:border-box;max-width:calc(var(--app-w) + 220px)}
body.dv-lap .grid{grid-template-columns:repeat(4,1fr)}
body.dv-lap .gal,body.dv-lap .gal .gslide,body.dv-lap .gsvg{height:420px}
body.dv-lap .nav{left:0;top:0;bottom:auto;height:100vh;width:220px;max-width:none;transform:none;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:24px 12px;border-top:0;border-right:1px solid var(--b)}
body.dv-lap .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:12px;font-size:14px;width:100%}
body.dv-lap .nav button.on{background:var(--sage)}
body.dv-lap .nav i{font-size:22px}
body.dv-lap .bbar{left:220px;right:0;transform:none;width:auto;max-width:none}
body.dv-lap .sheetov{align-items:center}
body.dv-lap .sheet{border-radius:20px;height:70vh;max-width:640px}

function render(keep){const y=scrollY;const f=V[S.view]||V.role;const nav=S.view==='main';
const tara=!['splash','role','login','otp','setup','ai','chatroom','plus','cart','checkout','detail'].includes(S.view);
document.body.classList.toggle('auth',AUTHV.includes(S.view));app.innerHTML=f()+(nav?navH():'')+(S.sheet?sheetH():'')+(tara?`<button class="tara" onclick="ai('tara')">🌿</button>`:'');
scrollTo(0,keep?y:0)}
function navH(){const T=[['home','🏠','Beranda'],['orders','📦','Pesanan'],['chat','💬','Chat'],['fav','❤️','Favorit'],['prof','👤','Profil']];
return `<nav class="nav">${T.map(t=>`<button class="${S.tab===t[0]?'on':''}" onclick="tab('${t[0]}')"><i>${t[1]}</i>${t[2]}${t[0]==='chat'?'<span class="dot" style="left:58%;top:4px">3</span>':''}</button>`).join('')}</nav>`}

/* ---------- AUTH ---------- */
function setRole(r){S.role=r;go('login')}
function sendOtp(){const v=$('ph').value.replace(/\D/g,'').replace(/^0/,'');
if(v.length<8||v.length>13)return toast('Nomor HP harus 8–13 digit');
if(!$('ag').checked)return toast('Setujui S&K terlebih dahulu');
S.phone=v;S.att=0;S.cd=60;go('otp')}
function resend(){S.cd=60;toast('Kode baru dikirim (Mode Demo: 123456)');render(1)}
function oi(i,el){el.value=el.value.replace(/\D/g,'');
if(el.value.length>1){const d=el.value.split('').slice(0,6);for(let j=0;j<6;j++)$('o'+j).value=d[j]||'';$('o'+Math.min(d.length,5)).focus();return}
if(el.value&&i<5)$('o'+(i+1)).focus()}
function verify(){const c=[0,1,2,3,4,5].map(i=>$('o'+i).value).join('');
if(S.att>=5){$('oe').textContent='Terkunci sementara karena terlalu banyak percobaan.';return}
if(c.length<6||c!=='123456'){S.att++;$('oe').textContent=S.att>=5?'Terkunci sementara (demo).':`Kode salah. Percobaan ${S.att}/5`;return}
if(S.user){S.hist=[];tab('home')}else go('setup')}
function eye(id){const e=$(id);e.type=e.type==='password'?'text':'password'}
function saveSetup(){const n=$('nm').value.trim(),p=$('pw').value;
if(!n)return $('se').textContent='Nama wajib diisi';
if(p.length<8||!/[a-z]/i.test(p)||!/\d/.test(p))return $('se').textContent='Password min. 8 karakter, kombinasi huruf dan angka';
if(p!==$('pw2').value)return $('se').textContent='Konfirmasi password tidak sama';
S.user={name:n,phone:S.phone};S.hist=[];tab('home')}

function fMatch(p){const f=S.f,fl=S.fl;
if(f.loc.length&&!f.loc.includes(p.loc))return false;
if(f.tipe.length&&!f.tipe.includes(pTipe(p)))return false;
if(f.pay.length&&!f.pay.some(x=>pPay(p).includes(x)))return false;
if(f.ship.length&&!f.ship.some(x=>pShip(p).includes(x)))return false;
if(f.pmin&&p.p<+f.pmin)return false;if(f.pmax&&p.p>+f.pmax)return false;
if(f.rate.length&&p.r<Math.min(...f.rate.map(x=>parseFloat(x))))return false;
if(f.cat.length&&!f.cat.some(c=>p.c.startsWith(c)))return false;
if(fl==='instan'&&!pShip(p).includes('Instan'))return false;
if(fl==='hari'&&!fresh(p))return false;
if(fl==='verif'&&pTipe(p)!=='Petani Terverifikasi')return false;
return true}

/* ---------- AI ---------- */
function ai(t){S.ai=t;go('ai')}
function askAI(t){t=(t||'').trim();if(!t||S.aiTyping)return;const T=S.ai,key=T==='tara'?'t':'k',lim=T==='tara'?10:5;
if(S.tier!=='plus'&&S.kq[key]>=lim)return render(1);
S.kq[key]++;S.chat[T].push({me:1,h:esc(t)});S.aiTyping=true;render(1);
setTimeout(()=>{S.aiTyping=false;S.chat[T].push({me:0,h:reply(T,t)});if(S.view==='ai'&&S.ai===T)render(1)},900)}
function reply(T,t){const s=t.toLowerCase();
if(T==='tara'){
if(s.includes('lacak')){const o=S.orders[0];return o?`Pesanan terakhirmu <b>${o.id}</b> berstatus <b>${o.st}</b>. Mau saya buka detailnya?`:'Kamu belum punya pesanan. Yuk mulai belanja!'}
if(s.includes('sayur'))return `Tentu! Ini pilihan sayur segar dari petani kami:<div class="row" style="margin-top:8px;gap:8px;align-items:stretch">${[P[1],P[5]].map(p=>`<div class="card" style="margin:0;padding:8px;flex:1;font-size:12px"><div style="font-size:26px;text-align:center">${p.e}</div><b>${p.n}</b><div class="pr" style="font-size:13px">${rp(p.p)}/${p.u}</div><button class="btn" style="margin-top:6px;padding:6px;min-height:0;font-size:12px" onclick="addC(${p.id},1)">Tambah ke Keranjang</button></div>`).join('')}</div>`;
if(s.includes('voucher'))return 'Pakai voucher di halaman Keranjang lalu pilih voucher yang berlaku. Koin juga bisa ditukar lewat toggle "Tukarkan Koin" saat checkout.';
const cs='<br><button class="btn o" style="width:auto;padding:6px 12px;min-height:0;font-size:12px;margin-top:6px" onclick="toast(\'Tiket bantuan dibuat (simulasi)\')">Hubungi Customer Service</button>';
if(s.includes('hubungi'))return 'Baik, saya bantu buatkan tiket bantuan untuk Customer Service.'+cs;
return 'Maaf, saya belum yakin dengan pertanyaan itu. Mau saya hubungkan ke Customer Service?'+cs}
const K=[['gembolo','Gembolo adalah umbi khas Jawa. Umbinya perlu diolah khusus sebelum dimakan, misalnya direndam lalu direbus. Ikuti panduan pengolahan yang benar.'],
['kimpul','Kimpul bisa dikukus, direbus, atau digoreng. Jangan dimakan mentah. Cocok untuk bubur dan kolak.'],
['sorgum','Sorgum bisa diolah jadi bubur, nasi campur, atau tepung. Untuk kandungan gizi pastinya, saya belum punya data yang pasti.'],
['ubi ungu','Ubi ungu adalah jenis ubi jalar berdaging ungu. Warna ungunya berasal dari antosianin. Rasanya cenderung lebih manis.'],
['bayam','Bayam cocok ditumis atau dimasak sayur bening. Simpan dingin di 0–5 °C dan habiskan dalam beberapa hari.'],
['jahe','Jahe merah sering dibuat wedang atau bumbu masakan. Untuk khasiat kesehatan, saya tidak yakin. Sebaiknya tanya tenaga kesehatan.']];
const f=K.find(k=>s.includes(k[0]));
return f?f[1]:'Saya belum punya jawaban pasti untuk itu. Coba tanyakan nama pangannya, atau tanya langsung ke petani lewat Chat.'}
function aiV(){const T=S.ai,L=S.chat[T],key=T==='tara'?'t':'k',lim=T==='tara'?10:5,cnt=S.kq[key],over=S.tier!=='plus'&&cnt>=lim;
return `<div class="bar">${bk()}${masc(40)}<div style="flex:1"><b>${T==='tara'?'Tara':'Kenali Panganku'}</b><div class="mu">● Online</div></div><button class="ib" title="Mulai Chat Baru" onclick="S.chat[S.ai]=[];render(1)">＋</button></div>
<div class="tabs"><button class="${T==='tara'?'on':''}" onclick="ai('tara')">Bantuan Belanja</button><button class="${T==='kenali'?'on':''}" onclick="ai('kenali')">Kenali Pangan</button></div>
<div style="padding:0 14px 6px;overflow-x:auto;white-space:nowrap">${(T==='tara'?TQ:KQ).map(q=>`<button class="chip" onclick="askAI('${q}')">${q}</button>`).join('')}</div>
${T==='kenali'?`<div style="padding:0 14px 6px;overflow-x:auto;white-space:nowrap"><span class="mu" style="font-size:12px">Pilih Pangan:</span>${FOODS.map(f=>`<button class="chip" onclick="askAI('Ceritakan tentang ${f}')">${f}</button>`).join('')}</div>`:''}
<div id="cl" style="padding:8px 14px 170px">${L.map(m=>`<div class="bubble ${m.me?'me':'ai'}">${m.h}</div>`).join('')}${S.aiTyping?'<div class="bubble ai mu">Sedang mengetik…</div>':''}</div>
<div class="bbar" style="flex-direction:column;align-items:stretch;gap:4px">${over?`<div class="row" style="justify-content:space-between"><span class="mu">Batas harian tercapai, upgrade ke PLUS untuk lanjut.</span><button class="btn" style="width:auto;padding:8px 14px;min-height:0;font-size:12px" onclick="go('plus')">Jadi PLUS</button></div>`
:`<div class="row"><input id="ai_in" placeholder="Tanya sesuatu..." onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();askAI(this.value)}"><button class="btn" style="width:auto;padding:10px 16px;min-height:0" onclick="askAI($('ai_in').value)">Kirim</button></div>`}
<p class="mu" style="font-size:11px;text-align:center">Sisa hari ini: ${S.tier==='plus'?'tanpa batas':Math.max(0,lim-cnt)+' pesan'}</p></div>`}
