<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PANGANTARA</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Caveat:wght@600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#2F5D3A;--sage:#E4ECD6;--krem:#FBF6E8;--or:#E8792B;--ku:#F2B233;--t:#2B2B2B;--t2:#6B6B6B;--b:#E3DFD0;--ok:#3B8B4F;--err:#C0392B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#e9e4d4;font-family:Nunito,system-ui,sans-serif;color:var(--t);display:flex;justify-content:center}
button{font-family:inherit;cursor:pointer}
#app{width:100%;max-width:430px;min-height:100vh;background:var(--krem);position:relative;padding-bottom:76px;overflow-x:hidden}
@media(min-width:500px){#app{margin:20px 0;min-height:860px;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.12)}}
h1,h2,h3{font-family:'Baloo 2',Nunito,sans-serif;line-height:1.15}
.logo{display:inline-flex;align-items:center;gap:6px;font:800 28px 'Baloo 2'}
.logo .sun{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle,var(--ku) 55%,transparent 60%);border:3px dotted var(--ku)}
.g{color:var(--g)}.o{color:var(--or)}
.hand{font-family:Caveat,cursive;font-size:20px;color:var(--or)}
.mu{color:var(--t2);font-size:13px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:100vh;padding:24px;gap:14px}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:14px;margin:0 14px 12px}
.btn{width:100%;padding:13px;border-radius:999px;border:0;background:var(--g);color:#fff;font:800 15px Nunito;min-height:46px}
.btn.o{background:#fff;color:var(--g);border:2px solid var(--g)}
.btn:disabled{opacity:.45}
.chip{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--sage);color:var(--g);font:700 13px Nunito;border:1.5px solid transparent;margin:3px;white-space:nowrap}
.chip.on{background:var(--g);color:#fff}
.bar{position:sticky;top:0;z-index:5;background:var(--krem);padding:12px 14px;display:flex;align-items:center;gap:10px}
.ib{background:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);position:relative;flex-shrink:0}
.dot{position:absolute;top:-3px;right:-3px;background:var(--or);color:#fff;font:800 10px Nunito;border-radius:999px;padding:0 5px}
.sb{display:flex;background:#fff;border-radius:999px;border:1.5px solid var(--b);padding:4px 4px 4px 16px;align-items:center;flex:1}
.sb input{border:0;padding:8px 0;font-size:14px;background:none;flex:1;min-width:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.pc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;min-width:0}
.pimg{height:112px;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}
.loc{position:absolute;top:6px;left:6px;background:rgba(255,255,255,.92);font:700 11px Nunito;padding:2px 8px;border-radius:999px;color:var(--g)}
.pb{padding:10px}
.pr{color:var(--g);font:800 16px 'Baloo 2'}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:14px 14px 8px}
.sec h3{color:var(--g);font-size:19px}
.sec a{color:var(--g);font-size:13px;font-weight:700;cursor:pointer}
.bn{margin:12px 14px 6px;border-radius:20px;background:linear-gradient(120deg,var(--g),#4f7f57);color:#fff;padding:20px;min-height:150px;position:relative;overflow:hidden}
.bn h2{font-size:24px;margin:4px 0}
.bn .big{position:absolute;right:14px;bottom:10px;font-size:64px}
.dots{text-align:center;margin-bottom:8px}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--b);margin:0 3px;cursor:pointer}
.dots i.on{background:var(--g);width:18px;border-radius:999px}
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none}
.cat{flex:0 0 auto;text-align:center;font:700 12px Nunito;width:66px;background:none;border:0;color:var(--t)}
.cat span{display:flex;width:56px;height:56px;margin:0 auto 4px;border-radius:50%;background:var(--sage);align-items:center;justify-content:center;font-size:26px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;border-top:1px solid var(--b);z-index:9}
.nav button{flex:1;background:none;border:0;padding:7px 0 9px;font:700 11px Nunito;color:var(--t2);position:relative}
.nav button.on{color:var(--g)}
.nav i{display:block;font-style:normal;font-size:19px}
.tara{position:fixed;left:max(16px,calc(50% - var(--app-w)/2 + 16px));bottom:86px;width:54px;height:54px;border-radius:50%;background:#fff;border:2px solid var(--g);font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:8}
.bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;border-top:1px solid var(--b);padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:9}
.bbar .btn{width:auto;flex:1;min-width:0;white-space:nowrap;padding:10px 8px;font-size:13px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--t);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:30;white-space:nowrap}
input,select{font:600 15px Nunito;padding:12px 14px;border:1.5px solid var(--b);border-radius:14px;width:100%;background:#fff;outline:none;color:var(--t)}
input:focus{border-color:var(--g)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--g)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font:800 11px Nunito;padding:3px 10px;border-radius:999px;background:var(--sage);color:var(--g);white-space:nowrap}
.step{display:flex;justify-content:space-between;margin-top:10px;font-size:10px;color:var(--t2);text-align:center}
.step i{display:block;width:12px;height:12px;border-radius:50%;background:var(--b);margin:0 auto 3px}
.step i.on{background:var(--g)}
.stp{display:flex;align-items:center;gap:10px}
.stp button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--g);background:#fff;color:var(--g);font-size:17px;font-weight:800}
.plus{background:linear-gradient(90deg,var(--ku),var(--or));color:#fff;font:800 10px Nunito;padding:2px 8px;border-radius:999px}
.lock{position:relative;overflow:hidden;border-radius:12px}
.lock .blur{filter:blur(4px);user-select:none;padding:10px;color:var(--t2);font-size:14px;line-height:1.6}
.lock .ov{position:absolute;inset:0;background:rgba(251,246,232,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.otp input{width:46px;height:56px;text-align:center;font:800 22px 'Baloo 2';padding:0}
.bubble{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.5;margin-bottom:8px}
.me{background:var(--g);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.ai{background:#fff;border:1px solid var(--b);border-bottom-left-radius:4px}
.tabs{display:flex;background:#fff;border-radius:999px;padding:4px;margin:0 14px 10px;border:1px solid var(--b)}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:999px;font:700 13px Nunito;color:var(--t2)}
.tabs button.on{background:var(--g);color:#fff}
.hd{background:linear-gradient(135deg,var(--g),#4f7f57);color:#fff;padding:22px 16px 34px;border-radius:0 0 26px 26px}
.empty{text-align:center;padding:40px 20px;color:var(--t2)}
.ill{font-size:64px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:8px 4px;border-bottom:1px solid var(--b);text-align:center}
.tbl td:first-child,.tbl th:first-child{text-align:left}
label{cursor:pointer}
.ic{width:40px;height:40px;display:inline-block;vertical-align:middle}
img.ic{object-fit:cover;border-radius:12px}
.pimg .ic{width:88px;height:88px;display:block}
.hero .ic{width:170px;height:170px;display:block}
.between .ic{width:24px;height:24px}
.gal-wrap{position:relative}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:260px;scrollbar-width:none;background:var(--sage)}
.gal::-webkit-scrollbar{display:none}
.gslide{flex:0 0 100%;scroll-snap-align:start;height:260px;overflow:hidden}
.gslide img{width:100%;height:100%;object-fit:cover;display:block}
.gsvg{height:260px;display:flex;align-items:center;justify-content:center}
.gsvg svg{width:170px;height:170px}
.gcount{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}
div[style*="width:60px"] .ic{width:60px;height:60px}
.pimg .ph,.hero .ph{width:100%;height:100%;border-radius:0}
.bn h2,.bn p,.bn button{position:relative;z-index:1}
.sheetov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--krem);width:100%;max-width:430px;border-radius:20px 20px 0 0;height:72vh;display:flex;flex-direction:column}
.sbody{flex:1;display:flex;min-height:0}
.side{width:118px;overflow-y:auto;background:#fff;border-right:1px solid var(--b)}
.side button{display:block;width:100%;text-align:left;padding:12px 10px;border:0;background:none;font:700 13px Nunito;color:var(--t2)}
.side button.on{color:var(--g);background:var(--krem);box-shadow:inset 3px 0 var(--g)}
.pane{flex:1;padding:12px;overflow-y:auto}
.pane input{width:48%;margin-right:2%}

:root{--app-w:430px}
body.dv-tab{--app-w:768px}
body.dv-lap{--app-w:1040px}
#app{max-width:var(--app-w)}
.nav,.bbar,.sheet{max-width:var(--app-w)}
body.dv-tab .grid{grid-template-columns:repeat(3,1fr)}
body.dv-tab .gal,body.dv-tab .gal .gslide,body.dv-tab .gsvg{height:340px}
body.dv-lap #app{margin:0 auto;border-radius:0;box-shadow:none;min-height:100vh;padding-bottom:24px}
body.dv-lap #app:has(.nav){padding-left:200px;box-sizing:border-box;max-width:calc(var(--app-w) + 200px)}
body.dv-lap .grid{grid-template-columns:repeat(4,1fr)}
body.dv-lap .gal,body.dv-lap .gal .gslide,body.dv-lap .gsvg{height:420px}
body.dv-lap .nav{left:0;top:0;bottom:auto;height:100vh;width:200px;max-width:none;transform:none;flex-direction:column;justify-content:flex-start;align-items:stretch;padding:24px 12px;border-top:0;border-right:1px solid var(--b)}
body.dv-lap .nav button{display:flex;align-items:center;flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:10px 12px;border-radius:12px;font-size:13px;width:100%;height:auto}
body.dv-lap .nav button.on{background:var(--sage)}
body.dv-lap .nav i{font-size:18px}
body.dv-lap .bbar{left:calc(50% + 100px);right:auto;transform:translateX(-50%);width:calc(100% - 200px);max-width:var(--app-w)}
body.dv-lap .sheetov{align-items:center}
body.dv-lap .sheet{border-radius:20px;height:70vh;max-width:640px}

/* ---------- AUTH ---------- */
function setRole(r){S.role=r;go('login')}
function sendOtp(){const v=$('ph').value.replace(/\D/g,'').replace(/^0/,'');
if(v.length<8||v.length>13)return toast('Nomor HP harus 8–13 digit');
if(!S.lg&&!$('ag').checked)return toast('Setujui S&K terlebih dahulu');
S.phone=v;S.att=0;S.cd=60;go('otp')}
function resend(){S.cd=60;toast('Kode baru dikirim (Mode Demo: 123456)');render(1)}
function oi(i,el){el.value=el.value.replace(/\D/g,'');
if(el.value.length>1){const d=el.value.split('').slice(0,6);for(let j=0;j<6;j++)$('o'+j).value=d[j]||'';$('o'+Math.min(d.length,5)).focus();return}
if(el.value&&i<5)$('o'+(i+1)).focus()}
function verify(){const c=[0,1,2,3,4,5].map(i=>$('o'+i).value).join('');
if(S.att>=5){$('oe').textContent='Terkunci sementara karena terlalu banyak percobaan.';return}
if(c.length<6||c!=='123456'){S.att++;$('oe').textContent=S.att>=5?'Terkunci sementara (demo).':`Kode salah. Percobaan ${S.att}/5`;return}
if(S.lg&&!S.user)S.user={name:'Pengguna',phone:S.phone};S.lg=false;if(S.user){S.hist=[];tab('home')}else go('setup')}
function eye(id){const e=$(id);e.type=e.type==='password'?'text':'password'}
function saveSetup(){const n=$('nm').value.trim(),p=$('pw').value;
if(!n)return $('se').textContent='Nama wajib diisi';
if(p.length<8||!/[a-z]/i.test(p)||!/\d/.test(p))return $('se').textContent='Password min. 8 karakter, kombinasi huruf dan angka';
if(p!==$('pw2').value)return $('se').textContent='Konfirmasi password tidak sama';
S.user={name:n,phone:S.phone,pw:p};S.hist=[];tab('home')}
function logout(){S.user=null;S.cart={};S.selc={};S.role=null;S.tier='biasa';S.hist=[];S.view='role';render()}

function pcard(p){return `<div class="pc" onclick="openP(${p.id})"><div class="pimg"><span class="loc">📍 ${p.loc}</span><span onclick="event.stopPropagation();fav(${p.id})" style="position:absolute;top:6px;right:6px;font-size:16px;background:rgba(255,255,255,.92);border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center">${S.fav[p.id]?'❤️':'🤍'}</span>${p.e}</div><div class="pb"><div style="font-size:13px;font-weight:700;min-height:34px">${p.n}</div><div class="pr">${rp(p.p)}<span class="mu">/${p.u}</span></div><div class="mu">⭐ ${p.r} · ${p.rv} ulasan</div><div class="mu">🧑‍🌾 ${p.f} <span style="color:var(--ok);font-weight:700">✔ Terverifikasi</span></div></div></div>`}
function fav(id){if(S.fav[id])delete S.fav[id];else S.fav[id]=1;render(1)}
function bnHtml(){const b=BN[S.bn];return `<div class="bn" style="background-image:linear-gradient(90deg,rgba(47,93,58,.85) 0%,rgba(47,93,58,.35) 60%,rgba(47,93,58,0) 100%),url('${BGS[S.bn]}');background-size:cover;background-position:center">${S.bn===0?'<span class="hand" style="position:absolute;top:12px;right:16px;color:var(--ku);font-size:17px">Hasil Bumi Langsung dari Tangan Petani</span>':''}<h2>${b[0]}</h2><p style="font-size:13px;opacity:.92;max-width:68%">${b[1]}</p><button class="btn" style="width:auto;padding:8px 16px;margin-top:12px;background:#fff;color:var(--g);min-height:0;font-size:13px" onclick="${b[4]}">${b[3]}</button></div><div class="dots">${BN.map((_,i)=>`<i class="${i===S.bn?'on':''}" onclick="bnSet(${i})"></i>`).join('')}</div>`}

function searchV(){
let L=P.filter(p=>!S.q||[p.n,p.loc,p.f,p.c].join(' ').toLowerCase().includes(S.q.toLowerCase()));
L=L.filter(fMatch);

if(S.so==='laris')L=[...L].sort((a,b)=>b.rv-a.rv);
if(S.so==='harga_asc')L=[...L].sort((a,b)=>a.p-b.p);
if(S.so==='harga_desc')L=[...L].sort((a,b)=>b.p-a.p);

return `<div class="bar">${bk()}<div class="sb"><input id="sq" value="${esc(S.q)}" placeholder="Cari produk..." onkeydown="if(event.key==='Enter'){S.q=this.value;render(1)}"></div><button class="ib" onclick="toast('Pencarian suara segera hadir')">🎤</button><button class="ib" onclick="S.sheet=1;render(1)">⚙️</button></div>
<div style="padding:0 14px 6px;overflow-x:auto;white-space:nowrap">${fc('instan','Instan')}${fc('hari','Hari Ini')}${fc('verif','Terverifikasi')}${fc('lokal','Lokal')}</div>
<div class="between" style="padding:4px 14px 10px"><span class="mu">${L.length} produk</span><select style="width:auto;padding:6px 10px;font-size:13px;border-radius:999px" onchange="S.so=this.value;render(1)"><option value="">Terbaru</option><option value="laris" ${S.so==='laris'?'selected':''}>Terlaris</option><option value="harga_asc" ${S.so==='harga_asc'?'selected':''}>Harga terendah</option><option value="harga_desc" ${S.so==='harga_desc'?'selected':''}>Harga tertinggi</option></select></div>
<div class="card" style="background:#fff8e6;border:1px dashed var(--ku);display:flex;align-items:center;gap:10px;padding:10px"><span style="font-size:24px">🧺</span><div style="flex:1;font-size:13px"><b>Toko Sponsor</b> <span class="st">Iklan</span><div class="mu">Kelompok Tani Makmur</div></div><button class="btn" style="width:auto;padding:6px 12px;min-height:0;font-size:12px" onclick="toast('Membuka toko sponsor')">Kunjungi</button></div>
${L.length?`<div class="grid">${L.map(pcard).join('')}</div>`:`<div class="empty"><div class="ill">🔍</div><p>Produk tidak ditemukan. Coba kata kunci lain.</p></div>`}`}
const FO={loc:['Kulon Progo','Sleman','Gunungkidul','Bantul'],tipe:['Petani Terverifikasi','Kelompok Tani'],pay:['COD','Transfer Bank','E-Wallet','QRIS'],ship:['Instan','Same Day','Reguler','Hemat Kargo','Ambil di Tempat'],rate:['4+ bintang','4.5+ bintang'],cat:CATS.map(c=>c[1])};
const SEC={loc:'Lokasi',tipe:'Tipe Penjual',pay:'Metode Pembayaran',ship:'Opsi Pengiriman',harga:'Batas Harga',rate:'Penilaian',cat:'Berdasarkan Kategori'};
const ETA={ins:'Hari ini',sd:'Hari ini',reg:'2–3 hari',hk:'4–6 hari',am:'Siap diambil'};
const fresh=p=>p.c==='Buah-buahan'||p.c.startsWith('Sayuran');
const pShip=p=>p.c.startsWith('Sayuran')?['Same Day','Ambil di Tempat']:fresh(p)?['Instan','Same Day','Reguler','Ambil di Tempat']:['Reguler','Hemat Kargo','Ambil di Tempat'];
const pPay=p=>p.f.startsWith('Kelompok')?['Transfer Bank','QRIS']:FO.pay;
const pTipe=p=>p.f.startsWith('Kelompok')?'Kelompok Tani':'Petani Terverifikasi';
function fMatch(p){const f=S.f,fl=S.fl;
if(f.loc.length&&!f.loc.includes(p.loc))return false;
if(f.tipe.length&&!f.tipe.includes(pTipe(p)))return false;
if(f.pay.length&&!f.pay.some(x=>pPay(p).includes(x)))return false;
if(f.ship.length&&!f.ship.some(x=>pShip(p).includes(x)))return false;
if(f.pmin&&p.p<+f.pmin)return false;if(f.pmax&&p.p>+f.pmax)return false;
if(f.rate.length&&p.r<Math.min(...f.rate.map(x=>parseFloat(x))))return false;
if(f.cat.length&&!f.cat.some(c=>p.c.startsWith(c)))return false;
if(fl==='instan'&&!pShip(p).includes('Instan'))return false;
if(fl==='hari'&&!fresh(p))return false;
if(fl==='verif'&&pTipe(p)!=='Petani Terverifikasi')return false;
return true}

function farmSums(it){return [...new Set(it.map(i=>P.find(p=>p.id===i).f))].map(f=>{const ii=it.filter(i=>P.find(p=>p.id===i).f===f),sub=ii.reduce((a,i)=>a+P.find(p=>p.id===i).p*S.cart[i],0),ok=allowedKeys(ii),want=S.shipF[f]||'reg',key=ok.includes(want)?want:ok[0],ship=SH[key][1],fee=Math.round(sub*0.03),disc=S.tier==='plus'?Math.min(ship,3000):0;return {f,ii,sub,key,ship,fee,disc,tot:sub+ship+fee-disc}})}

<p class="mu" style="font-size:12px;margin:8px 0 6px">Instan & Same Day hanya untuk produk segar.</p>
<p style="margin:14px 0 2px;font-weight:700;font-size:14px">Metode Pembayaran</p>
${Object.entries(PAY).map(([gk,gv])=>{const open=S.pg&&S.pg[gk]!==undefined?S.pg[gk]:S.pm.startsWith(gk+':');return `<div style="border-top:1px solid var(--b)"><button onclick="togPg('${gk}')" style="width:100%;background:none;border:0;display:flex;justify-content:space-between;align-items:center;padding:12px 0;font:700 14px Nunito;color:var(--t);cursor:pointer"><span>${gv.t}</span><span class="mu">${open?'▴':'▾'}</span></button>${open?gv.items.map(([ik,il])=>`<label style="display:flex;gap:10px;align-items:center;padding:8px 0 8px 6px;font-size:14px"><input type="radio" name="pmx" ${S.pm===gk+':'+ik?'checked':''} onchange="S.pm='${gk}:${ik}';render(1)"> ${il}</label>`).join(''):''}</div>`}).join('')}

const METRO=['Kota Yogyakarta','Sleman','Bantul'];
const RW=[10,20,30,40,50,70,100];
function defAddr(){return S.addr.find(a=>a.def)||S.addr[0]}
function inMetro(){return METRO.includes(defAddr().kota)}
function isF(f){return !!(S.fo&&S.fo[f])}
function togFollow(f){S.fo=S.fo||{};if(S.fo[f])delete S.fo[f];else S.fo[f]=1;toast(S.fo[f]?'Kamu mengikuti '+f:'Berhenti mengikuti '+f);render(1)}
function claimV(id){S.vown[id]=1;toast('Voucher berhasil diklaim');render(1)}
function vouchersV(){const own=VCH.filter(v=>S.vown[v.id]),other=VCH.filter(v=>!S.vown[v.id]);
const card=(v,btn)=>`<div style="display:flex;align-items:stretch;background:#fff;border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)"><div style="width:84px;background:${v.cat==='ongkir'?'var(--ok)':'var(--or)'};color:#fff;display:flex;align-items:center;justify-content:center;font:800 11px Nunito;text-align:center;padding:6px">${v.cat==='ongkir'?'GRATIS ONGKIR':'DISKON'}</div><div style="flex:1;padding:10px 12px"><b style="font-size:14px">${v.t}</b><div class="mu" style="font-size:12px">${v.min?'Min. belanja '+rp(v.min):'Tanpa minimal belanja'}</div><div style="margin-top:6px">${btn}</div></div></div>`;
return `<div class="bar">${bk()}<b style="flex:1;text-align:center">Voucher Saya</b></div><div style="padding:0 14px 20px">
<p class="mu" style="margin:4px 0 8px">Voucher yang kamu miliki. Dipakai saat checkout jika memenuhi minimal belanja.</p>${own.length?own.map(v=>card(v,'<span class="st">Dimiliki</span>')).join(''):'<p class="mu">Belum ada voucher.</p>'}

function followedV(){const F=[...new Set(P.map(p=>p.f))].filter(f=>isF(f));
return `<div class="bar">${bk()}<b style="flex:1;text-align:center">Petani yang Diikuti</b></div><div style="padding:0 14px 20px">${F.length?F.map(f=>{const L=P.filter(p=>p.f===f);return `<div class="card row" style="cursor:pointer" onclick="openFarm('${f}')"><span style="width:52px;height:52px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden">${AV[f]?`<img src="${AV[f]}" alt="" style="width:52px;height:52px;object-fit:cover">`:'🧑‍🌾'}</span><div style="flex:1;min-width:0"><b>${f}</b><div class="mu">📍 ${L[0].loc} · ${L.length} produk</div></div><button class="btn o" style="width:auto;padding:6px 12px;min-height:0;font-size:12px" onclick="event.stopPropagation();togFollow('${f}')">Berhenti</button></div>`}).join(''):`<div class="empty"><div class="ill">🧑‍🌾</div><p>Belum ada petani yang kamu ikuti. Buka profil petani lalu tekan Ikuti.</p><button class="btn" style="margin-top:12px;width:auto;padding:10px 22px" onclick="go('farmers')">Cari Petani</button></div>`}</div>`}
function klaimKoin(){const i=(S.cdi||0)%7,r=RW[i];S.koinBal+=r;S.kh.unshift(['Login harian · hari ke-'+(i+1),r]);S.cdone=true;toast('+'+r+' Koin Panara');render(1)}
function nextDay(){S.cdi=(S.cdi||0)+1;S.cdone=false;render(1)}
function koinV(){const d=(S.cdi||0)%7,claimed=!!S.cdone;
const tile=i=>{const done=i<d||(i===d&&claimed),today=i===d;return `<div style="position:relative;text-align:center;border-radius:12px;padding:8px 2px;overflow:hidden;background:url('${FIELDBG}') center/cover no-repeat;border:${today?'2px solid var(--g)':'1px solid var(--b)'}"><div style="position:absolute;inset:0;background:${done?'transparent':'rgba(150,150,150,.6)'}"></div><div style="position:relative"><div style="font-size:10px;color:#2b2b2b;font-weight:700">Hari ${i+1}</div><div style="margin:4px 0;filter:grayscale(${done?0:1});opacity:${done?1:.7}">${CIMG}</div><b style="font-size:12px;color:#2b2b2b">+${RW[i]}</b></div></div>`};
return `<div class="bar">${bk()}<b style="flex:1;text-align:center">Koin Panara</b></div><div style="padding:0 14px 20px">

<div class="card"><b>Login Harian</b><p class="mu" style="font-size:12px">Login setiap hari untuk koin tambahan. Hadiah naik tiap hari dan mencapai 100 koin di hari ke-7.</p>
<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px">${RW.map((r,i)=>tile(i)).join('')}</div>
<button class="btn" style="margin-top:14px" ${claimed?'disabled':''} onclick="klaimKoin()">${claimed?'Sudah login hari ini · besok +'+RW[(d+1)%7]:'Klaim +'+RW[d]+' Koin Panara'}</button>
${claimed?'<p style="text-align:center;margin-top:8px"><a class="mu" style="color:var(--g);font-weight:700;cursor:pointer" onclick="nextDay()">Simulasi hari berikutnya (demo)</a></p>':''}</div>

<button class="btn" onclick="S.ae=null;go('addrform')">+ Tambah Alamat</button></div>`}
function addrformV(){const a=S.ae?S.addr.find(x=>x.id===S.ae):null;
return `<div class="bar">${bk()}<b style="flex:1;text-align:center">${a?'Ubah Alamat':'Tambah Alamat'}</b></div><div style="padding:0 14px 20px">

<button class="btn" onclick="saveAddr()">Simpan Alamat</button>${a&&!a.def?`<button class="btn o" style="margin-top:10px" onclick="delAddr(${a.id})">Hapus Alamat</button>`:''}</div>`}
function saveAddr(){const l=$('al').value.trim()||'Alamat',ad=$('aa').value.trim(),k=$('ak').value,df=$('ad').checked;
if(!ad){toast('Alamat lengkap wajib diisi');return}
let id=S.ae;if(id){const a=S.addr.find(x=>x.id===id);a.label=l;a.addr=ad;a.kota=k}else{id=Date.now();S.addr.push({id,label:l,addr:ad,kota:k,def:false})}
if(df)setDef(id,true);else if(!S.addr.some(a=>a.def))setDef(S.addr[0].id,true);
S.ae=null;back();toast('Alamat disimpan')}
function setDef(id,s){S.addr.forEach(a=>a.def=a.id===id);if(!s)render(1)}
function delAddr(id){S.addr=S.addr.filter(a=>a.id!==id);if(!S.addr.some(a=>a.def)&&S.addr.length)S.addr[0].def=true;S.ae=null;back();toast('Alamat dihapus')}

function thumbH(pid,s){return PH[pid]?`<img src="${PH[pid]}" alt="" style="width:${s}px;height:${s}px;object-fit:cover;border-radius:12px;flex-shrink:0">`:`<div style="width:${s}px;height:${s}px;background:var(--sage);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">${art(pid).replace('class="ic"','style="width:'+Math.round(s*.7)+'px;height:'+Math.round(s*.7)+'px"')}</div>`}
function bonusOf(l){return 50+10*l.q}
function cens(n){return n.slice(0,2)+'***'}
function rateLbl(v){if(!v)return '';const w=v<=1?'Sangat Buruk':v<=2?'Buruk':v<=3?'Cukup':v<=4?'Bagus':'Sangat Bagus';return v+'/5 · '+w}
function starsH(k,size){const v=(S.rv&&S.rv[k])||0,W=Math.round(size*1.4);return `<span class="stars">${[1,2,3,4,5].map(i=>{const pct=v>=i?100:v>=i-0.5?50:0;return `<span class="star${pct>0?' rise':''}" style="width:${W}px;height:${W}px;animation-delay:${(i-1)*70}ms" onclick="starClick(event,'${k}',${i})"><img class="sg" src="${STARE}" alt=""><span class="clip" style="width:${pct}%"><img class="sg" src="${STARG}" alt="" style="width:${W}px;height:${W}px"></span></span>`}).join('')}</span>`}
function starsGreyH(size){const W=Math.round(size*1.4);return `<span class="stars">${[1,2,3,4,5].map(()=>`<span class="star" style="width:${W}px;height:${W}px"><img class="sg" src="${STARE}" alt=""></span>`).join('')}</span>`}
function setRV(k,v){S.rv=S.rv||{};S.rv[k]=v;render(1)}
function togTag(i){const t=RTAGS[i];S.rtag=S.rtag||[];const j=S.rtag.indexOf(t);if(j<0)S.rtag.push(t);else S.rtag.splice(j,1);render(1)}
function openRate(oid,pid){S.rt={oid,pid};S.rv={};S.rtpl={kondisi:'',tampilan:'',kualitas:''};S.rtxt='';S.rph=[];S.rhide=true;S.rtag=[];S.rcm='';go('rate')}

function submitRate(){const o=S.orders.find(x=>x.id===S.rt.oid),l=o.lines.find(x=>x.pid===S.rt.pid),p=P.find(x=>x.id===l.pid);
if(!S.rv.prod)return toast('Beri bintang untuk produk dulu');
const tplFilled=['kondisi','tampilan','kualitas'].some(k=>S.rtpl[k].trim());
if(!tplFilled&&S.rtxt.trim().length<20)return toast('Isi template atau tulis ulasan minimal 20 karakter');
const b=bonusOf(l);o.rated=o.rated||{};
o.rated[l.pid]={prod:S.rv.prod,seller:S.rv.seller||0,ship:S.rv.ship||0,courier:S.rv.courier||0,tpl:{...S.rtpl},txt:S.rtxt,hide:S.rhide,tags:[...S.rtag],cmsg:S.rcm,photos:(S.rph||[]).length,bonus:b};
S.koinBal+=b;S.kh.unshift(['Bonus penilaian '+p.n,b]);
S.rt=null;S.of='Penilaian';S.ot='belum';toast('Penilaian terkirim · +'+b+' Koin Panara');tab('orders')}
function thumbOrEmpty(){return ''}
function nilaiListH(){const it=[];S.orders.forEach(o=>{if(o.st!=='Selesai')return;(o.lines||[]).forEach(l=>{if(!(o.rated&&o.rated[l.pid]))it.push({o,l})})});
if(!it.length)return '<div class="empty"><div class="ill">⭐</div><p>Semua produk sudah dinilai. Terima kasih!</p></div>';
const tot=it.reduce((a,x)=>a+bonusOf(x.l),0);
return `<div class="card" style="background:#fff8e6;display:flex;align-items:center;gap:10px;margin:0 14px 12px">${CIMG}<div style="flex:1"><b>Nilai semuanya dan dapatkan hingga ${tot} Koin Panara</b><div class="mu" style="font-size:12px">${it.length} produk menunggu penilaianmu</div></div></div>`+it.map(x=>{const p=P.find(q=>q.id===x.l.pid);return `<div class="card" style="margin:0 14px 12px"><div class="row" style="gap:12px;align-items:flex-start">${thumbH(p.id,84)}<div style="flex:1;min-width:0"><b style="font-size:15px">${p.n}</b><div class="mu" style="font-size:12px">${x.l.q} ${p.u} · ${x.o.f}</div><div class="mu" style="font-size:12px;color:var(--err)">Sisa 14 hari untuk menilai</div><span class="st" style="background:var(--or);color:#fff;margin-top:6px;display:inline-block">Bonus +${bonusOf(x.l)} ${CIMG}</span></div></div><div class="row" style="justify-content:space-between;margin-top:10px;background:var(--krem);border-radius:12px;padding:8px 12px"><span class="mu">Nilai produk ini</span>${starsGreyH(18)}<button class="btn" style="width:auto;padding:6px 12px;min-height:0;font-size:12px" onclick="openRate('${x.o.id}',${p.id})">Nilai Sekarang</button></div></div>`}).join('')}
function lineRowH(l){const p=P.find(x=>x.id===l.pid);return `<div class="row" style="gap:12px;padding:8px 0;border-top:1px solid var(--b);align-items:center">${thumbH(l.pid,56)}<div style="flex:1;min-width:0"><b style="font-size:14px">${p.n}</b><div class="mu" style="font-size:12px">${l.q} ${p.u}</div></div></div>`}
function progCardH(o){const k=OI[o.st];const lines=o.lines?o.lines.map(lineRowH).join(''):`<p style="margin:6px 0;font-size:14px">${esc(o.items)}</p>`;
return `<div class="card"><div class="between"><div><b>🧑‍🌾 ${o.f||''}</b><div class="mu">${o.id}</div></div><span class="st">${o.st}</span></div>${lines}<div class="between" style="margin-top:6px"><span class="mu">Total</span><b class="pr" style="font-size:15px">${rp(o.tot)}</b></div><div class="step">${OL.map((l,i)=>`<div class="${i<k?'dn':''}" style="flex:1"><i class="${i<=k?'on':''}"></i>${l}</div>`).join('')}</div><div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">${OI[o.st]<4?lacakB():''}${act(o)}</div></div>`}
function selesaiCardH(o){const lines=(o.lines||[]).map(l=>{const rated=o.rated&&o.rated[l.pid];const p=P.find(x=>x.id===l.pid);return `<div style="padding:10px 0;border-top:1px solid var(--b)"><div class="row" style="gap:12px;align-items:center">${thumbH(l.pid,72)}<div style="flex:1;min-width:0"><b style="font-size:14px">${p.n}</b><div class="mu" style="font-size:12px">${l.q} ${p.u} × ${rp(p.p)}/${p.u}</div><b style="font-size:14px;color:var(--g)">${rp(p.p*l.q)}</b></div></div><div class="between" style="margin-top:8px;flex-wrap:wrap;gap:6px"><span class="st" style="background:${rated?'var(--ok)':'var(--or)'};color:#fff">${rated?'Sudah dinilai':'Belum dinilai'}</span><div class="row" style="gap:6px">${rated?`<button class="btn o" style="width:auto;padding:6px 12px;min-height:0;font-size:12px" onclick="toast('Penilaianmu: ${rated.prod} bintang')">Lihat Penilaian</button>`:`<button class="btn" style="width:auto;padding:6px 12px;min-height:0;font-size:12px" onclick="openRate('${o.id}',${l.pid})">Nilai</button>`}<button class="btn o" style="width:auto;padding:6px 12px;min-height:0;font-size:12px" onclick="addC(${l.pid},${l.q})">Beli Lagi</button></div></div></div>`}).join('');
return `<div class="card"><div class="between"><b>🧑‍🌾 ${o.f||''}</b><span class="st">Selesai</span></div><div class="mu" style="font-size:12px">${o.id}</div>${lines}<div class="between" style="margin-top:8px;border-top:1px solid var(--b);padding-top:8px"><span class="mu">Total pesanan</span><b class="pr">${rp(o.tot)}</b></div></div>`}

function search(q){S.q=q;S.fl='';S.so='';go('search')}
function openP(id){S.cur=id;S.qty=1;go('detail')}
function detailV(){const p=P.find(x=>x.id===S.cur),g=PAN[p.id]||PANX;
const slides=p.id===1?[`<img src="${GALB}" alt="">`,`<img src="${PH[1]}" alt="">`,`<img src="${HERO}" alt="">`]:[PH[p.id]?`<img src="${PH[p.id]}" alt="">`:`<div class="gsvg">${art(p.id)}</div>`];
return `<div class="bar">${bk()}<div style="font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.n}</div><button class="ib bks" onclick="fav(${p.id})">${S.fav[p.id]?'❤️':'🤍'}</button></div>
<div class="gal-wrap"><div class="gal" onscroll="galIdx(this)">${slides.map(s=>`<div class="gslide">${s}</div>`).join('')}</div><span class="gcount" id="gcnt">1/${slides.length}</span></div>
<div style="padding:14px 16px 96px">
<div class="between"><div class="pr" style="font-size:24px">${rp(p.p)}<span class="mu">/${p.u}</span></div><span class="st">Petani Terverifikasi ✔</span></div>
<h2 style="margin:6px 0 4px">${p.n}</h2><p class="mu">⭐ ${p.r} · ${p.rv} ulasan · Terjual ${p.rv*3}+</p>
<p class="mu" style="margin:8px 0">Stok tersedia: ${p.s} ${p.u} · Minimal beli 1 ${p.u}</p>
<div class="row" style="margin:4px 0 10px;gap:10px"><span class="mu">Jumlah</span><div class="stp"><button onclick="S.qty=Math.max(1,S.qty-1);render(1)">−</button><b>${S.qty}</b><button onclick="S.qty++;render(1)">+</button></div></div>
<div class="card" style="margin:0 0 12px;display:flex;gap:10px;align-items:center;padding:12px"><span style="width:44px;height:44px;border-radius:50%;background:var(--sage);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden">${AV[p.f]?`<img src="${AV[p.f]}" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover">`:'🧑‍🌾'}</span><div style="flex:1"><b>${p.f}</b><div class="mu">📍 ${p.loc}</div></div><button class="btn o" style="width:auto;padding:7px 12px;min-height:0;font-size:12px" onclick="openChat('${p.f}')">Chat</button> <button class="btn" style="width:auto;padding:7px 12px;min-height:0;font-size:12px" onclick="openFarm('${p.f}')">Profil</button></div>
<div class="card" style="margin:0 0 12px"><b>Info Panen</b><p class="mu">Tanggal panen: 28 Okt 2026 · Asal kebun: ${p.loc}</p><p class="mu">${p.d}</p></div>
${guideH(p,g)}${revH(p)}
</div>
<div class="bbar"><button class="ib" onclick="openChat('${p.f}')">💬</button><button class="btn o" onclick="addC(${p.id},S.qty)">+ Keranjang</button><button class="btn" onclick="buyNow(${p.id})">Beli Sekarang</button></div>`}
function addC(id,q){S.cart[id]=(S.cart[id]||0)+q;S.selc[id]=true;toast('Ditambahkan ke keranjang');render(1)}
function buyNow(id){Object.keys(S.selc).forEach(k=>S.selc[k]=false);S.cart[id]=S.qty;S.selc[id]=true;go('checkout')}
function cq(i,d){S.cart[i]=(S.cart[i]||0)+d;if(S.cart[i]<=0){delete S.cart[i];delete S.selc[i]}render(1)}
function selItems(){return Object.keys(S.cart).map(Number).filter(i=>S.selc[i])}
function cartV(){const ids=Object.keys(S.cart).map(Number);
if(!ids.length)return `<div class="bar">${bk()}<b>Keranjang Saya (0)</b></div><div class="empty"><div class="ill">🧺</div><p>Keranjangmu masih kosong.</p><button class="btn" style="margin-top:14px;width:auto;padding:10px 24px" onclick="tab('home')">Mulai Belanja</button></div>`;
const sel=selItems(),qa=ids.reduce((a,i)=>a+S.cart[i],0),qn=sel.reduce((a,i)=>a+S.cart[i],0),sum=sel.reduce((a,i)=>a+P.find(p=>p.id===i).p*S.cart[i],0),all=ids.every(i=>S.selc[i]);
const farmers=[...new Set(ids.map(i=>P.find(p=>p.id===i).f))];
const promo=S.tier==='plus'?'':`<div class="card" style="background:linear-gradient(90deg,#fde7b0,#fbd9c4);display:flex;align-items:center;gap:10px;margin-top:6px"><div style="flex:1"><b>PANGANTARA PLUS</b> <span class="plus">HEMAT</span><div class="mu">Hemat ongkir Rp10.000 &amp; buka asisten resep kuliner panen harian.</div></div><button class="btn" style="width:auto;padding:7px 12px;min-height:0;font-size:12px" onclick="go('plus')">Coba PLUS</button></div>`;

function placeOrder(){const it=selItems(),grp='PGT-'+Date.now().toString().slice(-8),T=totals();

setTimeout(()=>{S.aiTyping=false;S.chat[T].push({me:0,h:reply(T,t)});if(S.view==='ai'&&S.ai===T)render(1)},900)}
function reply(T,t){const s=t.toLowerCase();
if(T==='tara'){
if(s.includes('lacak')){const o=S.orders[0];return o?`Pesanan terakhirmu <b>${o.id}</b> berstatus <b>${o.st}</b>. Mau saya buka detailnya?`:'Kamu belum punya pesanan. Yuk mulai belanja!'}
if(s.includes('sayur'))return `Tentu! Ini pilihan sayur segar dari petani kami:<div class="row" style="margin-top:8px;gap:8px;align-items:stretch">${[P[1],P[5]].map(p=>`<div class="card" style="margin:0;padding:8px;flex:1;font-size:12px"><div style="font-size:26px;text-align:center">${p.e}</div><b>${p.n}</b><div class="pr" style="font-size:13px">${rp(p.p)}/${p.u}</div><button class="btn" style="margin-top:6px;padding:6px;min-height:0;font-size:12px" onclick="addC(${p.id},1)">Tambah ke Keranjang</button></div>`).join('')}</div>`;
if(s.includes('voucher'))return 'Pakai voucher di halaman Keranjang lalu pilih voucher yang berlaku. Koin juga bisa ditukar lewat toggle "Tukarkan Koin" saat checkout.';
const cs='<br><button class="btn o" style="width:auto;padding:6px 12px;min-height:0;font-size:12px;margin-top:6px" onclick="toast(\'Tiket bantuan dibuat (simulasi)\')">Hubungi Customer Service</button>';
if(s.includes('hubungi'))return 'Baik, saya bantu buatkan tiket bantuan untuk Customer Service.'+cs;
return 'Maaf, saya belum yakin dengan pertanyaan itu. Mau saya hubungkan ke Customer Service?'+cs}
const K=[['gembolo','Gembolo adalah umbi khas Jawa. Umbinya perlu diolah khusus sebelum dimakan, misalnya direndam lalu direbus. Ikuti panduan pengolahan yang benar.'],
['kimpul','Kimpul bisa dikukus, direbus, atau digoreng. Jangan dimakan mentah. Cocok untuk bubur dan kolak.'],
['sorgum','Sorgum bisa diolah jadi bubur, nasi campur, atau tepung. Untuk kandungan gizi pastinya, saya belum punya data yang pasti.'],
['ubi ungu','Ubi ungu adalah jenis ubi jalar berdaging ungu. Warna ungunya berasal dari antosianin. Rasanya cenderung lebih manis.'],
['bayam','Bayam cocok ditumis atau dimasak sayur bening. Simpan dingin di 0–5 °C dan habiskan dalam beberapa hari.'],
['jahe','Jahe merah sering dibuat wedang atau bumbu masakan. Untuk khasiat kesehatan, saya tidak yakin. Sebaiknya tanya tenaga kesehatan.']];
const f=K.find(k=>s.includes(k[0]));
return f?f[1]:'Saya belum punya jawaban pasti untuk itu. Coba tanyakan nama pangannya, atau tanya langsung ke petani lewat Chat.'}
function aiV(){const T=S.ai,L=S.chat[T],key=T==='tara'?'t':'k',lim=T==='tara'?10:5,cnt=S.kq[key],over=S.tier!=='plus'&&cnt>=lim;
return `<div class="bar">${bkS()}${masc(40)}<div style="flex:1"><b>${T==='tara'?'Tara':'Kenali Panganku'}</b><div class="mu">● Online</div></div><button class="chip" onclick="S.chat[S.ai]=[];render(1)">+ Chat baru</button></div>
<div class="tabs"><button class="${T==='tara'?'on':''}" onclick="ai('tara')">Bantuan Belanja</button><button class="${T==='kenali'?'on':''}" onclick="ai('kenali')">Kenali Pangan</button></div>
<div style="padding:0 14px 6px;overflow-x:auto;white-space:nowrap">${(T==='tara'?TQ:KQ).map(q=>`<button class="chip" onclick="askAI('${q}')">${q}</button>`).join('')}</div>
${T==='kenali'?`<div style="padding:0 14px 6px;overflow-x:auto;white-space:nowrap"><span class="mu" style="font-size:12px">Pilih Pangan:</span>${FOODS.map(f=>`<button class="chip" onclick="askAI('Ceritakan tentang ${f}')">${f}</button>`).join('')}</div>`:''}
<div id="cl" style="padding:8px 14px 170px">${L.map(m=>`<div class="bubble ${m.me?'me':'ai'}">${m.h}</div>`).join('')}${S.aiTyping?'<div class="bubble ai mu">Sedang mengetik…</div>':''}</div>
<div class="bbar" style="flex-direction:column;align-items:stretch;gap:4px">${over?`<div class="row" style="justify-content:space-between"><span class="mu">Batas harian tercapai, upgrade ke PLUS untuk lanjut.</span><button class="btn" style="width:auto;padding:8px 14px;min-height:0;font-size:12px" onclick="go('plus')">Jadi PLUS</button></div>`
:`<div class="row"><input id="ai_in" placeholder="Tanya sesuatu..." onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();askAI(this.value)}"><button class="btn" style="width:auto;padding:10px 16px;min-height:0" onclick="askAI($('ai_in').value)">Kirim</button></div>`}
<p class="mu" style="font-size:11px;text-align:center">Sisa hari ini: ${S.tier==='plus'?'tanpa batas':Math.max(0,lim-cnt)+' pesan'}</p></div>`}

${S.lg?`<label class="mu">Password</label><div class="row" style="margin:6px 0 4px"><input id="lpw" type="password" placeholder="Masukkan password"><button class="ib" onclick="eye('lpw')">👁</button></div><div style="text-align:right;margin-bottom:14px"><a class="mu" style="color:var(--g);font-weight:700;cursor:pointer" onclick="go('lupa')">Lupa password?</a></div>

lupa:lupaV,fpotp:fpotpV,fpnew:fpnewV,followed:followedV,rate:rateV,vouchers:vouchersV,koin:koinV,addr:addrV,addrform:addrformV,search:searchV,farmers:farmersV,farm:farmV,addprod:addProdV,detail:detailV,cart:cartV,checkout:checkoutV,pay:payV,success:successV,ai:aiV,chatroom:roomV,plus:plusV
};
